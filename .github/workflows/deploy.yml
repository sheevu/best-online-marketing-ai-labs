name: Validate Sudarshan site (Cloudflare auto-deploys main)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build, lint and test
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Build site
        run: npm run build

      - name: Verify rendered SEO routes
        run: node --test tests/rendered-html.test.mjs

      - name: Preserve verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudarshan-production-dist
          path: dist
          retention-days: 1
          if-no-files-found: error

